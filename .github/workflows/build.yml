name: build

# Every push on every branch builds — a branch never goes unbuilt until its PR. A PR's
# checks are its head commit's push run, so there is no separate pull_request trigger.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # Mirrors build.bat's preset -> config map. The VS 2022 generator is
      # MULTI-CONFIG, so CMAKE_BUILD_TYPE in the preset is ignored and the
      # compiled config MUST come from --config / -C (else everything builds Debug).
      # Vulkan is disabled explicitly (not left to the runner image): CI proves the
      # OpenGL-only build, the one a machine without the SDK gets.
      matrix:
        include:
          - preset: debug-editor
            config: Debug
          - preset: debug
            config: Debug
          - preset: release
            config: Release
    name: ${{ matrix.preset }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Test (CTest)
        run: ctest --test-dir build/${{ matrix.preset }} -C ${{ matrix.config }} --output-on-failure
