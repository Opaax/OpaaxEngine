name: build

# Every push on every branch builds and tests on Windows, Linux and macOS.
# A PR's checks are its head commit's push run.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: debug-editor
            config: Debug
          - os: windows-latest
            preset: release
            config: Release
          - os: ubuntu-24.04
            preset: debug-editor
            config: Debug
          - os: ubuntu-24.04
            preset: release
            config: Release
          - os: macos-14
            preset: debug-editor
            config: Debug
          - os: macos-14
            preset: release
            config: Release
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Problem matchers
        shell: bash
        run: |
          echo "::add-matcher::.github/problem-matchers/msvc.json"
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          echo "::add-matcher::.github/problem-matchers/doctest.json"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Multi-config generators ignore CMAKE_BUILD_TYPE: the config comes from --config / -C.
      # MSVC already compiles each project's files in parallel (/MP), so projects build one at a time.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }}
          else
            cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }} --parallel
          fi

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} -C ${{ matrix.config }} --output-on-failure
